name: Validate TRAUMAGOCHI

on:
  push:
    branches:
      - main
      - feature/traumagochi-depth
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game logic smoke tests
        run: node tests/validate.mjs
