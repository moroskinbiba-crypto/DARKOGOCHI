name: Validate TRAUMAGOCHI

on:
  push:
    branches:
      - main
      - feature/traumagochi-depth
      - fix/offline-simulation-clock
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run game logic smoke tests
        run: node tests/validate.mjs
